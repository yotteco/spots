<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ヨッテコ - App Store</title>
<!-- X広告のリンク先URL欄がクエリパラメータ付きURLを受け付けない（?が入力できない）ため、
     クエリなしのこのURLを広告に載せ、ここからApp Storeのキャンペーンリンク(ct=x-ad)へ
     即時リダイレクトする。ct/ptを変えたいときはこのファイルだけ差し替えればよい。 -->
<meta http-equiv="refresh" content="0;url=https://apps.apple.com/app/apple-store/id6790649055?pt=129161911&ct=x-ad&mt=8">
<script>location.replace("https://apps.apple.com/app/apple-store/id6790649055?pt=129161911&ct=x-ad&mt=8");</script>
</head>
<body>
<p><a href="https://apps.apple.com/app/apple-store/id6790649055?pt=129161911&ct=x-ad&mt=8">App Storeで「ヨッテコ」を開く</a></p>
</body>
</html>
